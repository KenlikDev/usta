name: Rust checks

on:
  push:
    branches:
      - "spike/**"
  pull_request:
    branches:
      - main
      - "docs/product-foundation"

permissions:
  contents: read

jobs:
  rust-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends \
            pkg-config libasound2-dev libudev-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libxinerama-dev libxkbcommon-dev libxkbcommon-x11-dev \
            libwayland-dev libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Check all targets
        run: cargo check --all-targets

      - name: Run tests
        run: cargo test --all-targets
